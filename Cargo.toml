[package]
name = "uma-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Library to simulate Umamusume: Pretty Derby races at scale"
readme = "README.md"
license = "MIT"
keywords = ["umamusume", "simulation", "racing", "game"]
categories = ["simulation", "games"]
publish = false

[dependencies]
base64 = "0.23"
derive_more = { version = "2", features = ["add", "add_assign", "mul", "not"] }
flate2 = "1"
num_enum = "0.7"
rand = "0.10"
rand_pcg = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
serde_with = "3.24"

# Release build with debug info, to profile simulations (e.g. with `perf`).
[profile.profiling]
inherits = "release"
debug = true
